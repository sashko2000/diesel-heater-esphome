                          - border: none
                          - opacity: |
                              [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; return (r === 'Starting' || r === 'Running') ? 1 : 0.45; ]]]]
                        custom_fields:
                          b:
                            - align-self: end
                            - width: 100%
                        name:
                          - font-size: 14px
                          - font-weight: 700
                          - color: |
                              [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; return ((r === 'Starting' || r === 'Running') && parseFloat(entity.state) === 3) ? '#f5a524' : 'var(--primary-text-color)'; ]]]]
                    - type: custom:button-card
                      entity: number.heater_level_diesel_heater
                      name: "4"
                      show_icon: false
                      show_state: false
                      triggers_update:
                        - sensor.run_state_diesel_heater
                      tap_action:
                        action: call-service
                        service: number.set_value
                        target:
                          entity_id: number.heater_level_diesel_heater
                        data:
                          value: 4
                      custom_fields:
                        b: |
                          [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; const run = r === 'Starting' || r === 'Running'; const lv = parseFloat(entity.state); const on = run && !isNaN(lv) && lv >= 4; return `<div style="height:54px;border-radius:7px;background:${on ? '#f5a524' : 'rgba(127,127,127,.25)'}"></div>`; ]]]]
                      styles:
                        grid:
