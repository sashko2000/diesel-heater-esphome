# Heater dashboard for Home Assistant (one view). Requires: HACS button-card, package packages/diesel_heater.yaml,
# firmware esphome/diesel-heater.yaml. Install: Settings -> Dashboards -> Add dashboard -> open it -> Edit ->
# ⋮ -> Raw configuration editor -> paste this whole file. Replace sensor.cabin_temperature with your cabin sensor.
views:
  - title: Heater
    path: heater
    icon: mdi:radiator
    type: panel
    cards:
      # Heater view: state on the left (power button in the top right corner of the tile, clickable level bars 1-6),
      # thermostat on the right (mode, comfort and antifreeze setpoints). 
      # Wide screen (900 px and more): two halves; narrower: one column. Requires HACS button-card and packages/diesel_heater.yaml.
      - type: custom:button-card
        show_name: false
        show_icon: false
        tap_action:
          action: none
        extra_styles: |
          #power { grid-area: status !important; justify-self: end !important; align-self: start !important; z-index: 2; margin: 10px 10px 0 0; }
          @media (max-width: 899px) {
            #container {
              grid-template-columns: minmax(0, 1fr) !important;
              grid-template-areas: "status" "thermo" !important;
            }
          }
          @media (max-width: 599px) {
            ha-card { padding: 8px !important; }
          }
        styles:
          card:
            - box-sizing: border-box
            - min-height: calc(100vh - var(--header-height, 56px))
            - padding: 14px 20px 20px 20px
            - border-radius: 0
            - box-shadow: none
            - border: none
            # Background: pure black in a dark HA theme, pure white in a light one
            - background: "[[[ return (hass.themes && hass.themes.darkMode) ? '#000000' : '#ffffff'; ]]]"
          grid:
            - grid-template-areas: '"status thermo"'
            - grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
            - grid-template-rows: auto
            - column-gap: 16px
            - row-gap: 16px
            - align-items: stretch
          custom_fields:
            status:
              - box-sizing: border-box
              - border: 1px solid rgba(127,127,127,.28)
              - border-radius: 20px
              - padding: 6px
              - "--ha-card-background": transparent
              - "--ha-card-box-shadow": none
              - "--ha-card-border-width": 0px
            thermo:
              - box-sizing: border-box
              - border: 1px solid rgba(127,127,127,.28)
              - border-radius: 20px
              - padding: 6px
              - "--ha-card-background": transparent
              - "--ha-card-box-shadow": none
              - "--ha-card-border-width": 0px
            power:
              - width: 128px
        custom_fields:
          # Power button: placed over the top right corner of the state tile (CSS #power in extra_styles)
          power:
            card:
              type: custom:button-card
              entity: switch.heater_power_diesel_heater
              icon: mdi:power
              show_state: false
              triggers_update:
                - sensor.run_state_diesel_heater
              name: |
                [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; return r === 'Stopped' ? 'Start' : (r === 'Starting' || r === 'Running') ? 'Stop' : r === 'Purge' ? 'Purge' : '—'; ]]]]
              tap_action:
                action: call-service
                service: switch.toggle
                target:
                  entity_id: switch.heater_power_diesel_heater
                confirmation:
                  text: |
                    [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; return (r === 'Starting' || r === 'Running') ? 'Stop the heater? A purge will start; do not cut the power meanwhile.' : r === 'Purge' ? 'Purge in progress: start will be refused. Send anyway?' : 'Start the heater?'; ]]]]
              styles:
                card:
                  - width: 128px
                  - height: 84px
                  - border-radius: 16px
                  - box-shadow: none
                  - background: |
                      [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; const c = r === 'Stopped' ? '#2f9e6f' : (r === 'Starting' || r === 'Running') ? '#e5484d' : r === 'Purge' ? '#4aa3ff' : '#9aa5b1'; return c + '26'; ]]]]
                  - border: |
                      [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; const c = r === 'Stopped' ? '#2f9e6f' : (r === 'Starting' || r === 'Running') ? '#e5484d' : r === 'Purge' ? '#4aa3ff' : '#9aa5b1'; return '2px solid ' + c; ]]]]
                  - opacity: |
                      [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; return (r === 'Stopped' || r === 'Starting' || r === 'Running') ? 1 : 0.55; ]]]]
                icon:
                  - width: 28px
                  - color: |
                      [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; return r === 'Stopped' ? '#2f9e6f' : (r === 'Starting' || r === 'Running') ? '#e5484d' : r === 'Purge' ? '#4aa3ff' : '#9aa5b1'; ]]]]
                name:
                  - font-size: 16px
                  - font-weight: 700
          # State: header, level bars 1-6 (tap sets the level), a line with heater temperature, link and the last command
          status:
            card:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  entity: sensor.run_state_diesel_heater
                  triggers_update:
                    - binary_sensor.heater_link_diesel_heater
                    - input_select.heater_mode
                  show_icon: true
                  show_name: true
                  show_state: true
                  tap_action:
                    action: more-info
                  icon: |
                    [[[[ const m = { 'Stopped': 'mdi:radiator-off', 'Starting': 'mdi:radiator', 'Running': 'mdi:fire', 'Purge': 'mdi:fan' }; return m[entity.state] || 'mdi:radiator-off'; ]]]]
                  state_display: |
                    [[[[ const link = (states['binary_sensor.heater_link_diesel_heater'] || {}).state === 'on'; if (!link) return 'No link'; return (entity.state === 'unknown' || entity.state === 'unavailable') ? '—' : entity.state; ]]]]
                  name: |
                    [[[[ const r = entity.state; const m = (states['input_select.heater_mode'] || {}).state || 'Manual'; const h = r === 'Purge' ? 'purge in progress, start after it' : r === 'Starting' ? 'ignition, about a minute and a half' : 'diesel heater'; return h + ' · mode: ' + m; ]]]]
                  styles:
                    grid:
                      - grid-template-areas: '"i s" "i n"'
                      - grid-template-columns: 64px minmax(0, 1fr)
                      - grid-template-rows: min-content min-content
                      - column-gap: 12px
                    card:
                      - padding: 12px 148px 6px 12px
                      - min-height: 96px
                    img_cell:
                      - width: 56px
                      - height: 56px
                      - border-radius: 50%
                      - background-color: |
                          [[[[ const link = (states['binary_sensor.heater_link_diesel_heater'] || {}).state === 'on'; const c = !link ? '#9aa5b1' : ({ 'Stopped': '#9aa5b1', 'Starting': '#f5a524', 'Running': '#e5484d', 'Purge': '#4aa3ff' }[entity.state] || '#9aa5b1'); return c + '26'; ]]]]
                    icon:
                      - width: 32px
                      - color: |
                          [[[[ const link = (states['binary_sensor.heater_link_diesel_heater'] || {}).state === 'on'; return !link ? '#9aa5b1' : ({ 'Stopped': '#9aa5b1', 'Starting': '#f5a524', 'Running': '#e5484d', 'Purge': '#4aa3ff' }[entity.state] || '#9aa5b1'); ]]]]
                    state:
                      - justify-self: start
                      - font-size: clamp(22px, 1.5vw + 12px, 30px)
                      - font-weight: 700
                      - color: |
                          [[[[ const link = (states['binary_sensor.heater_link_diesel_heater'] || {}).state === 'on'; return !link ? '#9aa5b1' : ({ 'Stopped': '#9aa5b1', 'Starting': '#f5a524', 'Running': '#e5484d', 'Purge': '#4aa3ff' }[entity.state] || '#9aa5b1'); ]]]]
                    name:
                      - justify-self: start
                      - font-size: 13px
                      - opacity: 0.75
                      - white-space: normal
                      - text-align: left
                - type: markdown
                  text_only: true
                  content: "Power level: tap a bar (1 minimum, 6 maximum). Always 1 in thermostat modes."
                - type: horizontal-stack
                  cards:
                    - type: custom:button-card
                      entity: number.heater_level_diesel_heater
                      name: "1"
                      show_icon: false
                      show_state: false
                      triggers_update:
                        - sensor.run_state_diesel_heater
                      tap_action:
                        action: call-service
                        service: number.set_value
                        target:
                          entity_id: number.heater_level_diesel_heater
                        data:
                          value: 1
                      custom_fields:
                        b: |
                          [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; const run = r === 'Starting' || r === 'Running'; const lv = parseFloat(entity.state); const on = run && !isNaN(lv) && lv >= 1; return `<div style="height:24px;border-radius:7px;background:${on ? '#f5a524' : 'rgba(127,127,127,.25)'}"></div>`; ]]]]
                      styles:
                        grid:
                          - grid-template-areas: '"b" "n"'
                          - grid-template-columns: minmax(0, 1fr)
                          - grid-template-rows: 1fr min-content
                        card:
                          - height: 104px
                          - padding: 4px 3px
                          - background: transparent
                          - box-shadow: none
                          - border: none
                          - opacity: |
                              [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; return (r === 'Starting' || r === 'Running') ? 1 : 0.45; ]]]]
                        custom_fields:
                          b:
                            - align-self: end
                            - width: 100%
                        name:
                          - font-size: 14px
                          - font-weight: 700
                          - color: |
                              [[[[ const r = (states['sensor.run_state_diesel_heater'] || {}).state; return ((r === 'Starting' || r === 'Running') && parseFloat(entity.state) === 1) ? '#f5a524' : 'var(--primary-text-color)'; ]]]]
                    - type: custom:button-card
                      entity: number.heater_level_diesel_heater
                      name: "2"
                      show_icon: false
                      show_state: false
                      triggers_update:
                        - sensor.run_state_diesel_heater
                      tap_action:
                        action: call-service
                        service: number.set_value
                        target:
                          entity_id: number.heater_level_diesel_heater
                        data:
                          value: 2
