<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1130" width="1400" height="1130" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="1400" height="1130" fill="#fafaf7"/>
<text x="40" y="45" font-size="26" text-anchor="start" font-weight="bold" fill="#263238">Diesel Heater — wiring: controller, ESP32 and power</text>
<text x="40" y="70" font-size="14" text-anchor="start" font-weight="normal" fill="#546e7a">Works together with the controller: ESP32 on the blue wire through 1 kOhm. Power: USB, or permanently 12 V through a fuse and a Mini360 (dashed, recommended).</text>
<polyline points="40,102 70,102" fill="none" stroke="#1565c0" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="78" y="106" font-size="13" text-anchor="start" font-weight="normal" fill="#263238">signal (blue wire, GPIO16: receive and transmit)</text>
<polyline points="459.20000000000005,102 489.20000000000005,102" fill="none" stroke="#212121" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="497.20000000000005" y="106" font-size="13" text-anchor="start" font-weight="normal" fill="#263238">common ground (GND)</text>
<polyline points="663.8000000000001,102 693.8000000000001,102" fill="none" stroke="#b71c1c" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="701.8000000000001" y="106" font-size="13" text-anchor="start" font-weight="normal" fill="#263238">+12 V</text>
<polyline points="764.8000000000001,102 794.8000000000001,102" fill="none" stroke="#d84315" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<text x="802.8000000000001" y="106" font-size="13" text-anchor="start" font-weight="normal" fill="#263238">5 V / controller red wire</text>
<rect x="60" y="140" width="260" height="250" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<text x="80" y="168" font-size="16" text-anchor="start" font-weight="bold" fill="#263238">Heater controller</text>
<text x="80" y="188" font-size="12" text-anchor="start" font-weight="normal" fill="#546e7a">controller cable goes to the heater,</text>
<text x="80" y="206" font-size="12" text-anchor="start" font-weight="normal" fill="#546e7a">3 wires (controller stays connected)</text>
<text x="308" y="244" font-size="13" text-anchor="end" font-weight="normal" fill="#263238">red: 5 V (4.96 V)</text>
<circle cx="320" cy="240" r="5" fill="#fff" stroke="#d84315" stroke-width="2"/>
<text x="308" y="294" font-size="13" text-anchor="end" font-weight="normal" fill="#263238">blue: data (2.3–3.4 V)</text>
<circle cx="320" cy="290" r="5" fill="#fff" stroke="#1565c0" stroke-width="2"/>
<text x="308" y="354" font-size="13" text-anchor="end" font-weight="normal" fill="#263238">black: GND</text>
<circle cx="320" cy="350" r="5" fill="#fff" stroke="#212121" stroke-width="2"/>
<polyline points="320,240 400,240" fill="none" stroke="#d84315" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="412" y="245" font-size="22" text-anchor="start" font-weight="bold" fill="#d84315">×</text>
<text x="440" y="245" font-size="12" text-anchor="start" font-weight="normal" fill="#d84315">do not connect the red wire to the ESP32 (the controller cannot supply it)</text>
<polyline points="320,290 520,290" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="520" y="278" width="100" height="24" rx="3" fill="#fff" stroke="#212121" stroke-width="2"/>
<text x="570.0" y="270" font-size="13" text-anchor="middle" font-weight="bold" fill="#263238">R1 1 kOhm</text>
<polyline points="620,290 900,290" fill="none" stroke="#1565c0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="760" y="282" font-size="11" text-anchor="middle" font-weight="normal" fill="#546e7a">to GPIO16</text>
<text x="420" y="326" font-size="11" text-anchor="start" font-weight="normal" fill="#546e7a">R1 1 kOhm: protects the pin and lets the ESP32 drive the line</text>
<text x="420" y="342" font-size="11" text-anchor="start" font-weight="normal" fill="#546e7a">(collision current at most 3 mA). No divider to GND.</text>
<rect x="900" y="140" width="340" height="330" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<text x="920" y="170" font-size="16" text-anchor="start" font-weight="bold" fill="#263238">ESP32 DevKit (heater)</text>
<text x="920" y="190" font-size="12" text-anchor="start" font-weight="normal" fill="#546e7a">power: USB (5 V)</text>
<text x="920" y="208" font-size="12" text-anchor="start" font-weight="normal" fill="#546e7a">permanent: VIN from Mini360 (no USB)</text>
<circle cx="900" cy="290" r="5" fill="#fff" stroke="#1565c0" stroke-width="2"/>
<text x="918" y="294" font-size="13" text-anchor="start" font-weight="normal" fill="#263238">GPIO16 · receive and transmit</text>
<circle cx="900" cy="350" r="5" fill="#fff" stroke="#212121" stroke-width="2"/>
<text x="918" y="354" font-size="13" text-anchor="start" font-weight="normal" fill="#263238">GND</text>
<circle cx="900" cy="420" r="5" fill="#fff" stroke="#d84315" stroke-width="2"/>
<text x="918" y="424" font-size="13" text-anchor="start" font-weight="normal" fill="#263238">VIN (5 V)</text>
<polyline points="320,350 900,350" fill="none" stroke="#212121" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="600" cy="350" r="4.5" fill="#212121"/>
<polyline points="600,350 600,380" fill="none" stroke="#212121" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="586,380 614,380" fill="none" stroke="#212121" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="591,386 609,386" fill="none" stroke="#212121" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="596,392 604,392" fill="none" stroke="#212121" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="626" y="400" font-size="11" text-anchor="start" font-weight="normal" fill="#546e7a">common ground</text>
<text x="40" y="470" font-size="16" text-anchor="start" font-weight="bold" fill="#263238">ESP32 POWER FROM 12 V (dashed: instead of USB)</text>
<rect x="60" y="490" width="220" height="150" rx="10" fill="#eceff1" stroke="#455a64" stroke-width="2" stroke-dasharray="8 5"/>
<text x="80" y="518" font-size="16" text-anchor="start" font-weight="bold" fill="#263238">12 V supply</text>
<text x="80" y="538" font-size="12" text-anchor="start" font-weight="normal" fill="#546e7a">(battery terminal block)</text>
<text x="268" y="574" font-size="13" text-anchor="end" font-weight="normal" fill="#263238">+12 V</text>
<text x="268" y="626" font-size="13" text-anchor="end" font-weight="normal" fill="#263238">minus</text>
<circle cx="280" cy="580" r="5" fill="#fff" stroke="#b71c1c" stroke-width="2"/>
<circle cx="280" cy="620" r="5" fill="#fff" stroke="#212121" stroke-width="2"/>
<polyline points="280,580 360,580" fill="none" stroke="#b71c1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
<rect x="360" y="566" width="80" height="28" rx="4" fill="#fff8e1" stroke="#455a64" stroke-width="2"/>
<polyline points="368,580 432,580" fill="none" stroke="#212121" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="400" y="556" font-size="14" text-anchor="middle" font-weight="bold" fill="#263238">F1 2 A</text>
<text x="400" y="650" font-size="11" text-anchor="middle" font-weight="normal" fill="#546e7a">in the +12 V line, close</text>
<text x="400" y="664" font-size="11" text-anchor="middle" font-weight="normal" fill="#546e7a">to the source</text>
<polyline points="440,580 520,580" fill="none" stroke="#b71c1c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
<polyline points="280,620 520,620" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
<rect x="520" y="490" width="240" height="150" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="8 5"/>
<text x="540" y="518" font-size="15" text-anchor="start" font-weight="bold" fill="#263238">Mini360 (DC-DC 12→5 V)</text>
<text x="540" y="538" font-size="12" text-anchor="start" font-weight="normal" fill="#546e7a">input 12 V, output 5.0 V</text>
<text x="540" y="632" font-size="11" text-anchor="start" font-weight="normal" fill="#546e7a">common minus</text>
<circle cx="520" cy="580" r="5" fill="#fff" stroke="#b71c1c" stroke-width="2"/>
<circle cx="520" cy="620" r="5" fill="#fff" stroke="#212121" stroke-width="2"/>
<circle cx="760" cy="580" r="5" fill="#fff" stroke="#d84315" stroke-width="2"/>
<circle cx="760" cy="620" r="5" fill="#fff" stroke="#212121" stroke-width="2"/>
<text x="534" y="584" font-size="12" text-anchor="start" font-weight="normal" fill="#263238">IN+</text>
<text x="534" y="624" font-size="12" text-anchor="start" font-weight="normal" fill="#263238">IN−</text>
<text x="746" y="584" font-size="12" text-anchor="end" font-weight="normal" fill="#263238">OUT+</text>
<text x="746" y="624" font-size="12" text-anchor="end" font-weight="normal" fill="#263238">OUT−</text>
<polyline points="760,580 860,580 860,420 900,420" fill="none" stroke="#d84315" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
<text x="868" y="520" font-size="13" text-anchor="start" font-weight="bold" fill="#d84315">5.0 V</text>
<polyline points="760,620 800,620 800,350" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 5"/>
<circle cx="800" cy="350" r="4.5" fill="#212121"/>
<text x="40" y="700" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">1. Measured with the controller connected: red–black 4.96 V; blue–black 2.3–3.4 V (the meter averages the digital signal). The blue line is about 3.3</text>
<text x="40" y="720" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    V logic: no divider needed (a 100 kOhm + 200 kOhm divider gave 1.3–2.3 V, below the ESP32 input threshold of about 2.5 V). Not verified with an</text>
<text x="40" y="740" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    oscilloscope.</text>
<text x="40" y="768" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">2. R1 is 1 kOhm so the ESP32 can drive the line (commands from HA). If the controller screen behaves strangely, use 5.1 kOhm: receiving still works,</text>
<text x="40" y="788" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    but commands from HA will not get through.</text>
<text x="40" y="816" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">3. Do NOT connect the controller red wire (5 V) to the ESP32: powering an ESP32 with Wi-Fi from it made the controller screen flicker (not enough</text>
<text x="40" y="836" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    current). With USB power the flicker was gone.</text>
<text x="40" y="864" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">4. Power: USB (5 V), or permanently (dashed): +12 V -> fuse F1 2 A (in the plus line, close to the source) -> Mini360 -> ESP32 VIN. Never connect USB</text>
<text x="40" y="884" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    and VIN at the same time.</text>
<text x="40" y="912" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">5. Before connecting the ESP32, feed the Mini360 with 12 V without load and set the output to 5.0 V with the trimmer and a multimeter (from the</text>
<text x="40" y="932" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    factory it is often set differently). Wires at least 0.5 mm². The board draws about 0.25 A at 5 V (about 0.12 A at 12 V), so the fuse has a large</text>
<text x="40" y="952" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    margin.</text>
<text x="40" y="980" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">6. Common ground is required: controller black wire, ESP32 GND, Mini360 output and 12 V minus are connected together.</text>
<text x="40" y="1008" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">7. Protocol (see docs/protocol.md): not UART. PWM words: bit about 12 ms ("0" = 4 ms high + 8 ms low, "1" = the opposite), sync: low 30 ms. Frame:</text>
<text x="40" y="1028" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    controller command 8 bit (A6 none, A2 power, A3 up, A4 down, AF temperature) + heater reply 16 bit. The board sends only the needed command in the</text>
<text x="40" y="1048" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    pause between controller frames (80–300 ms after the last edge); verified: the controller kept working and the level changed by ESP32 commands. A2</text>
<text x="40" y="1068" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">    toggles start/stop; a start during purge is impossible (neither from the controller nor from HA).</text>
<text x="40" y="1096" font-size="13" text-anchor="start" font-weight="normal" fill="#37474f">8. This diagram is for working together with the controller. Without the controller the firmware also works (it polls A6 once per second itself).</text>
</svg>